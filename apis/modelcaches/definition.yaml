apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: modelcaches.modelplane.ai
spec:
  group: modelplane.ai
  names:
    categories: [crossplane, modelplane, models]
    kind: ModelCache
    plural: modelcaches
    shortNames: [mc]
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    additionalPrinterColumns:
    - name: SOURCE
      type: string
      jsonPath: .spec.source.huggingFace.repo
    - name: READY
      type: string
      jsonPath: .status.summary.ready
    schema:
      openAPIV3Schema:
        type: object
        required: [spec]
        properties:
          spec:
            type: object
            required: [source]
            x-kubernetes-validations:
            - rule: "self.source != 'HuggingFace' || has(self.huggingFace)"
              message: spec.huggingFace is required when spec.source is HuggingFace.
            - rule: "self.source != 'OCI' || has(self.oci)"
              message: spec.oci is required when spec.source is OCI.
            - rule: "self.source != 'Existing' || has(self.existing)"
              message: spec.existing is required when spec.source is Existing.
            properties:
              source:
                type: string
                enum: [HuggingFace, OCI, Existing]
                description: >-
                  Which kind of artifact source to stage from. The
                  matching source object (e.g. spec.huggingFace) must
                  be set.
              huggingFace:
                type: object
                description: >-
                  HuggingFace source. Required when source is
                  HuggingFace.
                required: [repo]
                properties:
                  repo:
                    type: string
                    description: HuggingFace repository ID.
                    minLength: 1
                  revision:
                    type: string
                    description: >-
                      Branch, tag, or commit SHA. Defaults to the
                      repo's default branch.
                  authSecret:
                    type: object
                    description: >-
                      Optional Secret holding an HF token for gated or
                      private repos. Names a Secret in the ModelCache's
                      own namespace; Modelplane propagates it to each
                      matched cluster for the hydration Job to read.
                    required: [name]
                    properties:
                      name:
                        type: string
                        minLength: 1
                      key:
                        type: string
                        default: HF_TOKEN
                  include:
                    type: array
                    description: >-
                      Glob patterns naming the files to stage. Defaults
                      to every file in the repository. A repository
                      often publishes the same weights more than once,
                      in the format each framework wants; narrowing is
                      declared here because a cache doesn't know which
                      engine reads it.
                    items:
                      type: string
                      minLength: 1
                  exclude:
                    type: array
                    description: >-
                      Glob patterns naming files to skip, applied after
                      include.
                    items:
                      type: string
                      minLength: 1
                  sizeGiB:
                    type: integer
                    description: >-
                      Capacity to allocate for the staged artifact on
                      each matched cluster. Defaults to the size of the
                      files selected from the repository, plus
                      headroom. Set it to stage without resolving the
                      repository, which is what a control plane with no
                      egress to HuggingFace needs.
                    minimum: 1
                    maximum: 100000
              oci:
                type: object
                description: >-
                  OCI source. Required when source is OCI. Nothing is
                  staged onto a volume: the artifact is pulled per node
                  by the cluster itself, so there is no sizeGiB and no
                  hydration Job.

                  Modelplane does not read the registry, so it reports a
                  cluster Ready once it has published how to mount the
                  reference, not once the reference is known good. A
                  typo, a missing tag or an unusable credential surfaces
                  at pod start, from the kubelet or the driver, rather
                  than on this resource.
                required: [ref, artifact]
                properties:
                  artifact:
                    type: string
                    enum: [Image, ModelArtifact]
                    description: >-
                      What kind of artifact the reference names, which
                      decides how it mounts. Image is a container image
                      with the weights inside, mounted by Kubernetes as
                      an image volume. ModelArtifact is built to the
                      model spec and read by a CSI driver, because a
                      container runtime will not mount one. Required,
                      and deliberately not defaulted: mounting a model
                      artifact as an image volume succeeds and yields
                      an EMPTY directory, with no error on the pod or
                      the cache, so a wrong guess here is invisible
                      until an engine fails to find weights. Measured
                      on GKE 1.36 with containerd 2.2.6.
                  ref:
                    type: string
                    description: >-
                      A tag or digest. Prefer a digest: a tag is
                      re-resolved on every pod start, so moving it
                      changes what the next pod serves. A private
                      registry's credential is configured on the
                      InferenceCluster by the platform team rather than
                      per namespace.
                    minLength: 1
                  subPath:
                    type: string
                    description: >-
                      Directory within the artifact holding the
                      weights. Defaults to its root.
              existing:
                type: object
                description: >-
                  A claim you populated yourself, on every cluster this
                  cache matches. Modelplane stages nothing and provisions
                  nothing: it observes the claim, reports Ready only once
                  it is Bound, and publishes how to mount it. For an
                  air-gapped or regulated fleet whose weights are on disk
                  before Modelplane sees them.
                required: [claimName]
                properties:
                  claimName:
                    type: string
                    description: >-
                      Name of a PersistentVolumeClaim in the default
                      namespace of every matched cluster. The same name
                      on each: a cache names one artifact, and a claim
                      that is missing on a cluster leaves that cluster
                      Failed rather than the whole cache.
                    minLength: 1
                  subPath:
                    type: string
                    description: >-
                      Directory within the volume holding the weights.
                      Defaults to its root.
                  readOnly:
                    type: boolean
                    default: true
                    description: >-
                      Whether to mount the claim read-only. Defaults to
                      true, since Modelplane did not populate it and an
                      engine writing into someone else's volume is
                      rarely intended.
              clusterSelector:
                type: object
                description: >-
                  Label selector to pick the InferenceClusters that
                  stage this artifact. If omitted, the cache replicates
                  to every cluster.
                properties:
                  matchLabels:
                    type: object
                    additionalProperties:
                      type: string
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
              summary:
                type: object
                description: Per-cluster ready / total counts.
                properties:
                  ready:
                    type: string
                    description: e.g. "2/3"
              clusters:
                type: array
                description: Per-cluster staging status.
                items:
                  type: object
                  required: [name]
                  properties:
                    name:
                      type: string
                    phase:
                      type: string
                      enum: [Pending, Hydrating, Ready, Failed]
                    message:
                      type: string
                    mount:
                      type: object
                      description: >-
                        What a consumer adds to a pod to read this
                        cache on this cluster. A consumer joins on this
                        rather than deriving a claim name, so a second
                        source needs no change in the consumer.
                      properties:
                        volumes:
                          type: array
                          description: >-
                            Volumes to add. One of
                            persistentVolumeClaim or image, per source.
                          maxItems: 4
                          items:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                        volumeMounts:
                          type: array
                          description: Mounts to add to each engine container.
                          maxItems: 4
                          items:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
                        env:
                          type: array
                          description: >-
                            Environment the mount needs to be
                            resolvable, e.g. HF_HUB_CACHE for a
                            HuggingFace cache root.
                          maxItems: 8
                          items:
                            type: object
                            x-kubernetes-preserve-unknown-fields: true
              artifact:
                type: object
                description: >-
                  What the source resolved to. Latched once obtained,
                  so a resolution outage doesn't regress a staged
                  cache.
                properties:
                  selection:
                    type: string
                    description: >-
                      Fingerprint of the inputs that decide which files
                      are staged (repo, revision, include, exclude). A
                      change re-resolves; anything else reuses this.
                  revision:
                    type: string
                    description: Commit SHA the repo resolved to.
                  fileCount:
                    type: integer
                    description: Number of files selected for staging.
                  files:
                    type: array
                    description: >-
                      The files the hydration Job stages, set only when
                      include or exclude narrowed the repository.
                    items:
                      type: string
                  sizeGiB:
                    type: integer
                    description: >-
                      Capacity allocated per cluster, derived from the
                      selected files unless spec.huggingFace.sizeGiB
                      overrode it.
